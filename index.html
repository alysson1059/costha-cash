<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costha Cash | Plataforma VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta Dark & Neon Teal */
            --bg-body: #0a0e17;       /* Fundo super escuro, quase preto */
            --bg-card: #141b29;       /* Fundo do formulário, um pouco mais claro */
            --text-main: #ffffff;     /* Texto branco puro */
            --text-muted: #a0aab5;   /* Texto secundário cinza claro */
            --teal-neon: #00f2fe;    /* Destaque principal: Teal vibrante */
            --teal-gradient: linear-gradient(45deg, #00f2fe, #4facfe); /* Gradiente moderno */
            --teal-dim: #008c99;      /* Teal mais escuro para bordas */
            --black-leather: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', sans-serif; }

        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }

       /* Banner Principal - Alinhado à esquerda para focar no seu rosto */
        header {
            position: relative;
            background-image: url('imagem.jpg');
            background-size: cover;
            
            /* ALTERAÇÃO AQUI: 'left top' mantém você na tela mesmo no celular */
            background-position: left top; 
            
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            border-bottom: 2px solid var(--teal-dim);
        }

        /* Sobreposição Gradiente na Foto (Dark Overlay) */
        header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(10,14,23,0) 0%, rgba(10,14,23,0.9) 100%);
            z-index: 1;
        }

        header .header-content { position: relative; z-index: 2; max-width: 800px; margin: 0 auto; text-align: center;}
        header h1 { 
            font-size: 4rem; font-weight: 800; text-transform: uppercase; letter-spacing: 4px; 
            background: var(--teal-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0,242,254,0.5); margin-bottom: 10px;
        }
        header p { font-size: 1.2rem; color: var(--text-muted); font-weight: 400; letter-spacing: 1px;}

        /* Conteúdo Principal (O Formulário) */
        .main-content { padding: 40px 20px; position: relative; z-index: 10; margin-top: -60px; } /* Sobe um pouco o form */

        .container { 
            max-width: 600px; margin: 0 auto; background: var(--bg-card); padding: 40px; 
            border-radius: 12px; border: 1px solid rgba(0,242,254,0.1); /* Bordas sutis neon */
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h2 { margin-bottom: 30px; text-align: center; color: var(--text-main); font-weight: 700; font-size: 2rem; letter-spacing: 1px; text-transform: uppercase;}

        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;}
        input { 
            width: 100%; padding: 16px; background-color: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; outline: none; 
            transition: 0.3s; font-size: 1rem; color: var(--text-main);
        }
        input:focus { border-color: var(--teal-neon); background-color: rgba(255,255,255,0.05); box-shadow: 0 0 10px rgba(0,242,254,0.2);}

        /* Botão Principal Neon */
        .btn-register { 
            width: 100%; padding: 18px; background: var(--teal-gradient); border: none; 
            color: var(--black-leather); font-weight: 800; font-size: 1.2rem; border-radius: 8px; 
            cursor: pointer; transition: 0.4s; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(0,242,254,0.3);
        }
        .btn-register:hover { 
            transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,242,254,0.5); 
        }

        /* Mensagens */
        .error { color: #ff6b6b; font-weight: 600; margin-top: 20px; display: none; text-align: center; background: rgba(255,107,107,0.1); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,107,107,0.3);}
        .success { color: var(--teal-neon); font-weight: 600; margin-top: 20px; display: none; text-align: center; background: rgba(0,242,254,0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(0,242,254,0.3);}

        /* Área Administrativa Dark Tech */
        .admin-section { margin-top: 60px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 40px; text-align: center; }
        .admin-btn { background: #1a2236; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); padding: 12px 24px; font-size: 0.85rem; width: auto; display: inline-block; border-radius: 30px; text-transform: uppercase; letter-spacing: 1px;}
        .admin-btn:hover { background: #232e48; color: var(--text-main); border-color: rgba(255,255,255,0.2);}
        
        #loginAdm { display:none; margin: 25px auto 0; max-width: 350px; background: #1a2236; padding: 25px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05);}
        #painelReal { display: none; margin-top: 40px; background: #111827; padding: 30px; border-radius: 12px; border: 1px solid var(--teal-dim);}
        
        .sorteado-card { background: #1f2937; margin: 15px 0; padding: 25px; border-radius: 10px; border-left: 5px solid var(--teal-neon); text-align: left; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .sorteado-card strong { color: var(--teal-neon); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;}
        .reveal-btn { padding: 8px 15px; font-size: 0.8rem; width: auto; display: inline-block; margin-top: 10px; background: transparent; color: var(--teal-neon); border: 1px solid var(--teal-neon); text-transform: uppercase; border-radius: 4px;}
        .reveal-btn:hover { background: rgba(0,242,254,0.1);}

        /* Responsividade */
       @media (max-width: 768px) {
            header {
                height: 55vh; /* Altura menor no celular */
                background-position: left top; /* Garante que o rosto na esquerda apareça */
                background-size: cover; 
            }
            header h1 {
                font-size: 2.2rem;
                text-shadow: 0 0 10px #000; /* Melhora a leitura sobre a foto */
            }
            .main-content { margin-top: -30px; padding: 15px;}
            .container { padding: 25px 15px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <h1>Costha Cash</h1>
        <p>A PLATAFORMA EXCLUSIVA PARA SEGUIDORES VIP</p>
    </div>
</header>

<div class="main-content">
    <div class="container">
        <h2>CADASTRE SEU CUPOM</h2>
        <div class="form-group">
            <label>NOME COMPLETO</label>
            <input type="text" id="nome" placeholder="Seu nome aqui">
        </div>
        <div class="form-group">
            <label>WHATSAPP (DDD + 9 + NÚMERO)</label>
            <input type="tel" id="tel" placeholder="Ex: 11987654321" maxlength="15">
        </div>
        <div class="form-group">
            <label>CÓDIGO DA COMPRA (SHOPEE / ML)</label>
            <input type="text" id="cupom" placeholder="Digite o número do pedido">
        </div>
        <button onclick="salvarCupom()" class="btn-register">REGISTRAR COMPRA AGORA</button>
        <p id="msgErro" class="error">ERRO: Este cupom já está cadastrado no sistema!</p>
        <p id="msgSucesso" class="success">SUCESSO: Sua compra foi validada e registrada.</p>

        <div class="admin-section">
            <button class="admin-btn" onclick="toggleLogin()">PAINEL DO ADMINISTRADOR</button>
            
            <div id="loginAdm">
                <input type="email" id="emailAdm" placeholder="E-mail ADM" style="margin-bottom:12px;">
                <input type="password" id="senhaAdm" placeholder="Senha ADM">
                <button onclick="fazerLogin()" style="margin-top:15px; background:var(--bg-body); color:var(--text-main); border: 1px solid rgba(255,255,255,0.1);">ACESSAR</button>
            </div>

          <div id="painelReal">
    <h3 style="color:var(--text-main); margin-bottom: 25px; text-transform: uppercase;">GERENCIAR SORTEIO VIP</h3>

    <div style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
        <div style="display: flex; gap: 10px;">
            <div style="display: flex; flex-direction: column; align-items: flex-start;">
                <label style="font-size: 0.7rem; color: var(--text-muted);">DATA INICIAL</label>
                <input type="date" id="dataInicio" style="width: 150px; padding: 8px; font-size: 0.8rem;">
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-start;">
                <label style="font-size: 0.7rem; color: var(--text-muted);">DATA FINAL</label>
                <input type="date" id="dataFim" style="width: 150px; padding: 8px; font-size: 0.8rem;">
            </div>
        </div>
    </div>

    <div id="contadorCupons" style="color: var(--teal-neon); font-weight: 700; margin-bottom: 15px; font-size: 1.1rem; text-align: center;">
        CUPONS NO PERÍODO: <span id="totalFiltrado">0</span>
    </div>

    <div style="margin-bottom: 20px;">
        <input type="text" id="buscaCupom" placeholder="Pesquisar por nome ou telefone..." 
               style="width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--teal-dim); border-radius: 8px; color: white;"
               oninput="atualizarPainelAdm()">
    </div>

    <div id="listaPesquisa" style="max-height: 250px; overflow-y: auto; margin-bottom: 25px; text-align: left; font-size: 0.85rem; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
        <p style="padding: 15px; color: var(--text-muted); text-align: center;">Aguardando filtros ou pesquisa...</p>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 25px; color: var(--text-muted);">
        <label style="margin: 0; text-transform: none;">Número de Ganhadores (1-5):</label>
        <input type="number" id="qtdSorteio" min="1" max="5" value="1" style="width: 70px; text-align: center; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid #333; color: white; border-radius: 5px;">
    </div>
    
    <button onclick="sortear()" class="btn-register" style="background: #1f2937; color: var(--teal-neon); border: 1px solid var(--teal-neon); box-shadow: none;">REALIZAR SORTEIO AGORA</button>
    <div id="resultadoSorteio" style="margin-top: 30px;"></div>
</div>


    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    // 2. SUAS CONFIGURAÇÕES DO FIREBASE (Inseridas aqui)
    const firebaseConfig = {
        apiKey: "AIzaSyAcLU51QcxPOZJr8Hy0cUwDdizzJSyBbn4",
        authDomain: "costha-cash.firebaseapp.com",
        databaseURL: "https://costha-cash-default-rtdb.firebaseio.com",
        projectId: "costha-cash",
        storageBucket: "costha-cash.firebasestorage.app",
        messagingSenderId: "555325857677",
        appId: "1:555325857677:web:ca49a5b56df98fa1e7a7c4"
    };

    // Inicializar o Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const auth = firebase.auth();

    // --- FUNÇÃO PARA SALVAR CUPOM ---
    function salvarCupom() {
        const nome = document.getElementById('nome').value.trim();
        const telRaw = document.getElementById('tel').value.replace(/\D/g, '');
        const cupom = document.getElementById('cupom').value.trim();
        const erro = document.getElementById('msgErro');
        const sucesso = document.getElementById('msgSucesso');

        if(!nome || telRaw.length < 10 || !cupom) {
             alert("Por favor, preencha todos os campos corretamente.");
             return;
        }

        // Verifica no Firebase se o cupom já existe
        database.ref('cupons/' + cupom).once('value', (snapshot) => {
            if (snapshot.exists()) {
                erro.style.display = 'block';
                sucesso.style.display = 'none';
            } else {
                // Se não existir, salva o novo
                database.ref('cupons/' + cupom).set({
                    nome: nome,
                    tel: telRaw,
                    cupom: cupom,
                    data_cadastro: new Date().toISOString()
                }).then(() => {
                    erro.style.display = 'none';
                    sucesso.style.display = 'block';
                    // Limpa os campos
                    document.getElementById('nome').value = "";
                    document.getElementById('tel').value = "";
                    document.getElementById('cupom').value = "";
                }).catch((error) => {
                    alert("Erro ao salvar: " + error.message);
                });
            }
        });
    }

    // --- FUNÇÃO DE LOGIN ADM ---
  function fazerLogin() {
    const email = document.getElementById('emailAdm').value.trim();
    const senha = document.getElementById('senhaAdm').value;

    if (!email || !senha) {
        alert("Por favor, preencha o e-mail e a senha.");
        return;
    }

    // Tenta logar no Firebase
    auth.signInWithEmailAndPassword(email, senha)
        .then((userCredential) => {
            // Se der certo, limpa e abre o painel
            document.getElementById('loginAdm').style.display = 'none';
            document.getElementById('painelReal').style.display = 'block';
            document.querySelector('.admin-btn').style.display = 'none';
            alert("Acesso permitido! Bem-vindo.");
        })
        .catch((error) => {
            // Aqui tratamos o erro para o usuário
            console.error("Erro técnico:", error.code);
            
            // Independente do erro técnico, mostramos a mesma mensagem amigável
            if (error.code === 'auth/invalid-credential' || 
                error.code === 'auth/user-not-found' || 
                error.code === 'auth/wrong-password') {
                alert("Acesso negado: E-mail ou senha incorretos.");
            } else if (error.code === 'auth/too-many-requests') {
                alert("Muitas tentativas falhas. Tente novamente mais tarde.");
            } else {
                alert("Erro ao tentar fazer login. Verifique sua conexão.");
            }
        });
}

    // --- FUNÇÃO DE SORTEIO ---
   function sortear() {
    const resultadoDiv = document.getElementById('resultadoSorteio');
    const dataInicio = document.getElementById('dataInicio').value;
    const dataFim = document.getElementById('dataFim').value;
    
    resultadoDiv.innerHTML = "<p style='color:var(--teal-neon)'>Filtrando cupons...</p>";

    database.ref('cupons').once('value', (snapshot) => {
        const data = snapshot.val();
        if(!data) {
            resultadoDiv.innerHTML = "<p style='color:#ff6b6b'>Nenhum cupom no sistema.</p>";
            return;
        }

        let listaCupons = Object.values(data);

        // --- LÓGICA DE FILTRO POR DATA ---
        if (dataInicio || dataFim) {
            listaCupons = listaCupons.filter(cupom => {
                // Remove o horário da data de cadastro para comparar apenas o dia
                const dataCupom = cupom.data_cadastro.split('T')[0];
                
                let checkInicio = dataInicio ? (dataCupom >= dataInicio) : true;
                let checkFim = dataFim ? (dataCupom <= dataFim) : true;
                
                return checkInicio && checkFim;
            });
        }

        if (listaCupons.length === 0) {
            resultadoDiv.innerHTML = "<p style='color:#ff6b6b'>Nenhum cupom encontrado nesse período.</p>";
            return;
        }

        let qtd = parseInt(document.getElementById('qtdSorteio').value);
        resultadoDiv.innerHTML = "";
        if (qtd > listaCupons.length) qtd = listaCupons.length;

        // Sorteio aleatório
        let sorteados = listaCupons.sort(() => 0.5 - Math.random()).slice(0, qtd);

        sorteados.forEach((s, index) => {
            const ultimos4 = s.tel.slice(-4);
            const ddd = s.tel.slice(0, 2);
            const card = document.createElement('div');
            card.className = 'sorteado-card';
            card.innerHTML = `
                <strong>${index+1}º Ganhador(a):</strong> ${s.nome}<br>
                <span style="font-size:0.7rem; color:var(--teal-neon)">Data: ${s.data_cadastro.split('T')[0]}</span><br>
                <span style="color:var(--text-muted);">WhatsApp: (${ddd}) ****-****${ultimos4}</span><br>
                <button onclick="revelarSorteado(this, '${s.tel}')" class="reveal-btn">Revelar Número</button>
            `;
            resultadoDiv.appendChild(card);
        });
    });
}
function revelarSorteado(btn, tel) {
    // Essa linha garante que o número apareça formatado corretamente (XX) X XXXX-XXXX
    const formatado = `(${tel.slice(0,2)}) ${tel.slice(2,7)}-${tel.slice(7)}`;
    btn.parentElement.innerHTML = btn.parentElement.innerHTML.split('<button')[0] + `<br><span style="color:var(--teal-neon); font-size:1.1rem; font-weight:600;">${formatado}</span>`;
}

    function toggleLogin() {
        const box = document.getElementById('loginAdm');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function atualizarPainelAdm() {
        const dataInicio = document.getElementById('dataInicio').value;
        const dataFim = document.getElementById('dataFim').value;
        const busca = document.getElementById('buscaCupom').value.toLowerCase();
        const totalSpan = document.getElementById('totalFiltrado');
        const listaDiv = document.getElementById('listaPesquisa');

        database.ref('cupons').once('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) { totalSpan.innerText = "0"; return; }

            let cupons = Object.values(data);

            if (dataInicio || dataFim) {
                cupons = cupons.filter(c => {
                    const dataC = c.data_cadastro.split('T')[0];
                    return (dataInicio ? dataC >= dataInicio : true) && (dataFim ? dataC <= dataFim : true);
                });
            }

            if (busca) {
                cupons = cupons.filter(c => c.nome.toLowerCase().includes(busca) || c.tel.includes(busca));
            }

            totalSpan.innerText = cupons.length;

            if (busca || dataInicio || dataFim) {
                listaDiv.innerHTML = cupons.map(c => `
                    <div style="border-bottom: 1px solid rgba(255,255,255,0.1); padding: 10px; color: #eee;">
                        <b style="color:var(--teal-neon)">Nome:</b> ${c.nome}<br>
                        <b>Cupom:</b> ${c.cupom} | <b>Tel:</b> ${c.tel}<br>
                        <small style="color:var(--text-muted)">Cadastrado em: ${new Date(c.data_cadastro).toLocaleString('pt-BR')}</small>
                    </div>
                `).join('');
            } else {
                listaDiv.innerHTML = "<p style='padding:10px; color:var(--text-muted)'>Filtre para listar.</p>";
            }
        });
    }

    // Monitora o login para ativar os filtros
    auth.onAuthStateChanged((user) => {
        if (user) {
            atualizarPainelAdm();
            document.getElementById('dataInicio').addEventListener('change', atualizarPainelAdm);
            document.getElementById('dataFim').addEventListener('change', atualizarPainelAdm);
        }
    });
    
</script>

</body>
</html>
